# Netlify 배포 설정
# 현재 프로젝트는 빌드 과정이 없는 정적 사이트입니다.
# "빌드"는 공개 가능한 정적 파일을 publish/ 폴더로 모으는 작업으로 정의합니다.

[build]
  # 공개(배포)할 디렉터리. 이 폴더 안의 파일만 웹에 공개됩니다.
  publish = "publish"

  # 서버리스 함수 폴더. publish 폴더 바깥에 있어 공개 출력에 포함되지 않습니다.
  functions = "netlify/functions"

  # 공개 파일을 publish/로 모으는 스크립트. Node가 없는 환경에서도 동작하도록 PowerShell 사용.
  # (Netlify 빌드 환경에서는 bash가 기본이므로, Netlify에서 돌릴 경우 build.sh 사용을 권장 — 아래 주석 참고)
  command = "pwsh -NoProfile -File ./build.ps1"

# Netlify의 Linux 빌드 환경에서는 PowerShell 대신 bash 스크립트가 더 안전합니다.
# Git 연동 배포로 Netlify에서 직접 빌드한다면 위 command를 "bash ./build.sh" 로 바꾸세요.
# (build.sh도 이 저장소에 포함해 두었습니다.)

[functions]
  # Node 기반 함수 런타임
  node_bundler = "esbuild"

# 기본 보안 헤더(선택). 필요 없으면 지워도 됩니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
